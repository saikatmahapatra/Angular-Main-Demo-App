<h1 class="page-title"><span>{{title}}</span> Project</h1>
<div class="back-to-page mb-3">
  <a [routerLink]="['/project/manage-project']"><app-icon [name]="'chevronLeft'"></app-icon>Back</a>
</div>
<div class="row">
  <div class="col-12">
    <app-card>
      <div card-header>Form</div>
      <div card-body>
        <div class="row">
          <div class="col-md-6 col-lg-5 col-xl-4">
            <form [formGroup]="myForm" class="form app-form" (ngSubmit)="onSubmit()">
              <input type="hidden" formControlName="id">
              <input type="hidden" formControlName="action">
              <div class="mb-3">
                <app-input [label]="'Project Name'" [type]="'text'" [name]="'projectName'" [inputId]="'projectName'"
                  formControlName="projectName"></app-input>
                <app-validation-error [control]="myForm.controls['projectName']"></app-validation-error>
              </div>
              <div class="mb-3">
                <app-select [label]="'Project Category'" [name]="'category'" [inputId]="'category'"
                  [placeholder]="'-'" [options]="categoryList" [optionLabel]="'name'" [optionValue]="'id'"
                  [showClear]="false" formControlName="category"></app-select>
                <app-validation-error [control]="myForm.controls['category']"></app-validation-error>
              </div>
              <div class="mb-3">
                <app-input [label]="'Commencement Year'" [type]="'number'" [name]="'commencementYear'"
                  [inputId]="'commencementYear'" [min]="2014" [max]="2099" [step]="1"
                  formControlName="commencementYear"></app-input>
                <app-validation-error
                [control]="myForm.controls['commencementYear']"></app-validation-error>
              </div>
              <div class="mb-3">
                <app-input [label]="'Reference Number'" [type]="'text'" [name]="'refNumber'" [inputId]="'refNumber'"
                  [maxLength]="4" formControlName="refNumber"></app-input>
                <app-validation-error [control]="myForm.controls['refNumber']"></app-validation-error>
              </div>

              <div class="mb-3">
                <app-input [label]="'Project Code'" [type]="'text'" [name]="'projectCode'" [inputId]="'projectCode'"
                  [maxLength]="16" [readonly]="!editProjectCode" formControlName="projectCode"></app-input>
                @if (!editProjectCode) {
                  <div class="small">This code is auto generated based on your input. Do you want to edit it? <a class="btn btn-sm btn-link py-0" (click)="editProjectCode = true">Edit code</a></div>
                }
                <app-validation-error [control]="myForm.controls['projectCode']"></app-validation-error>
              </div>

              <div class="mb-3">
                <app-date-picker [label]="'Start Date'" [name]="'startDate'" [inputId]="'startDate'"
                  [dateFormat]="'dd/mm/yy'" [readonlyInput]="true" [showButtonBar]="false" [showIcon]="true"
                  [appendTo]="'body'" formControlName="startDate"></app-date-picker>
                <app-validation-error [control]="myForm.controls['startDate']"></app-validation-error>
              </div>
              <div class="mb-3">
                <app-date-picker [label]="'End Date'" [name]="'endDate'" [inputId]="'endDate'"
                  [dateFormat]="'dd/mm/yy'" [readonlyInput]="true" [showButtonBar]="false" [showIcon]="true"
                  [appendTo]="'body'" formControlName="endDate"></app-date-picker>
                <app-validation-error [control]="myForm.controls['endDate']"></app-validation-error>
              </div>
              <div class="mb-3">
                <app-text-area [label]="'Description'" [name]="'description'" [textareaId]="'description'"
                  [maxLength]="150" formControlName="description"></app-text-area>
                <app-validation-error [control]="myForm.controls['description']"></app-validation-error>
              </div>

              <div class="mb-3">
                <label class="required" for="status">Status</label>
                <div>
                  @for (data of DataStatus; track data; let i = $index) {
                    <div class="form-check form-check-inline"
                      >
                      <input class="form-check-input" type="radio" id="inlineRadio_{{i}}"
                        value="{{data.id}}" formControlName="status">
                      <label class="form-check-label" for="inlineRadio_{{i}}">{{data.name}}</label>
                    </div>
                  }
                </div>
                <app-validation-error [control]="myForm.controls['status']"></app-validation-error>
              </div>

              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </div>
        </div>
      </div> <!--/.card-body-->
    </app-card> <!--/.card-->
  </div>
</div>
