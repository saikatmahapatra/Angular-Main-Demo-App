<h1 class="page-title">Edit Basic Information</h1>
<div class="back-to-page mb-3">
  <a [routerLink]="['/emp/my-profile']"><app-icon [name]="'chevronLeft'" [styleClass]=""></app-icon>Back</a>
</div>
<div class="row">
  <div class="col-12">
    <app-card>
      <div card-header>Form</div>
      <div card-body>
        <app-alert-message [mode]="'toast'"></app-alert-message>
        <div class="row">
          <div class="col-md-6 col-lg-5 col-xl-4">
            <form [formGroup]="myForm" class="form app-form" (ngSubmit)="onSubmit()">
              <input type="hidden" formControlName="id">
              <input type="hidden" formControlName="action">

              <div class="mb-3">
                <label class="required" for="personalEmail">Personal Email</label>
                <app-input [type]="'email'" [name]="'personalEmail'" [inputId]="'personalEmail'"
                  formControlName="personalEmail"></app-input>
                <app-validation-error
                [control]="myForm.controls['personalEmail']"></app-validation-error>
              </div>

              <div class="mb-3">
                <label class="required" for="personalPhone">Personal Phone</label>
                <app-input [type]="'tel'" [name]="'personalPhone'" [inputId]="'personalPhone'"
                  formControlName="personalPhone" [maxLength]="10"></app-input>
                <app-validation-error
                [control]="myForm.controls['personalPhone']"></app-validation-error>
              </div>

              <div class="mb-3">
                <label class="optional" for="workPhone">Work Phone</label>
                <app-input [type]="'tel'" [name]="'workPhone'" [inputId]="'workPhone'" formControlName="workPhone"
                  [maxLength]="10"></app-input>
                <app-validation-error [control]="myForm.controls['workPhone']"></app-validation-error>
              </div>

              <div class="mb-3">
                <label class="optional" for="bloodGroup">Blood Group</label>
                <app-select [name]="'bloodGroup'" [inputId]="'bloodGroup'" [placeholder]="'Select'"
                  [options]="bloodGroupList" [optionLabel]="'name'" [optionValue]="'id'" [showClear]="false"
                  formControlName="bloodGroup"></app-select>
                <app-validation-error [control]="myForm.controls['bloodGroup']"></app-validation-error>
              </div>
              <app-button [type]="'submit'">Submit</app-button>
            </form>
            <!-- <p class="debug">Form Status: <span class="text-bold">{{ myForm.status }}</span></p>
            <p class="debug">{{myForm.value|json}}</p> -->
          </div>
        </div>

      </div>
    </app-card>
  </div>
</div>
